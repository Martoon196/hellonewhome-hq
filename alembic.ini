# Alembic configuration for Hello New Home HQ.
#
# There is deliberately no sqlalchemy.url here: alembic/env.py takes the database from
# app.config.DATABASE_URL (the same environment variable the app reads), so a connection
# string never has to be written into a file. Run from the repository root, for example:
#
#   .venv/bin/alembic upgrade head
#   .venv/bin/alembic revision --autogenerate -m "describe the change"
#
# At startup the app applies the same scripts itself (app.migrations.run_migrations).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[post_write_hooks]

# Logging for the command-line tool only; the app leaves its own logging alone.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
